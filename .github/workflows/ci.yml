name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      - run: chmod +x gradlew
      - run: ./gradlew test
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/build/reports/jacoco/test/jacocoTestReport.xml
          flags: backend

  frontend-local:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend-local/.nvmrc
          cache: yarn
          cache-dependency-path: frontend-local/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn run check
      - run: yarn test:unit --run --coverage --coverage.reporter=lcov --coverage.include='src/**'
      - run: yarn build
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend-local/coverage/lcov.info
          flags: frontend-local

  frontend-usuario:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-usuario
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend-usuario/.nvmrc
          cache: npm
          cache-dependency-path: frontend-usuario/package-lock.json
      - run: npm ci
      - run: npx eslint src
      - run: npx vitest run --coverage --coverage.include='src/**'
      - run: npm run build
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend-usuario/coverage/lcov.info
          flags: frontend-usuario
